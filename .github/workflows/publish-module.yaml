name: Publish Script to PSGallery

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: MichaelEscamilla/GetMSIInformation
          path: GetMSIInformation
          ref: main

      - name: Publish to PowerShell Gallery
        run: |
          pwsh -Command "Publish-Script -Path ${{ github.workspace }}\GetMSIInformation\GetMSIInformation.ps1 -Verbose -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY"
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}